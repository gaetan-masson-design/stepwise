# Weekly version updates. Security fixes are handled separately by
# Dependabot security updates (enabled in the repo settings) and arrive as needed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor and patch bumps; each major bump gets its own PR,
      # since those are the ones likely to need code changes.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
